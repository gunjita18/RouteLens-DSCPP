name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libasio-dev libcurl4-openssl-dev libcjson-dev libssl-dev zlib1g-dev

      - name: Configure (CMake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (CMake)
        run: cmake --build build -j2

      - name: Test (CMake targets)
        run: ctest --test-dir build --output-on-failure

      - name: Test (OSM loader, Makefile)
        run: make test

  web-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check web/app.js
