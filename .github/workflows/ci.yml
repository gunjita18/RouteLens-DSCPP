name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ libasio-dev libcurl4-openssl-dev libcjson-dev libssl-dev zlib1g-dev

      - name: Configure (CMake)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build (CMake)
        run: cmake --build build -j2

      - name: Test (CMake targets)
        run: ctest --test-dir build --output-on-failure

  web-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check web/app.js

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build image
        run: docker build -t routelens .

      - name: Smoke test (container starts and answers /api/health)
        run: |
          docker run -d --name routelens-ci -p 18080:18080 routelens
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:18080/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:18080/api/health | grep -q '"status":"ok"'

      - name: Container log (on failure)
        if: failure()
        run: docker logs routelens-ci
